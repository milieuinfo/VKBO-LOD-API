<!DOCTYPE html>
<html
        xmlns:th="http://www.thymeleaf.org"
        xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
        xmlns:rdfs="http://www.w3.org/2000/01/rdf-schema#">

<head>
    <meta charset="UTF-8"/>
    <title th:text="'RDF Fiche: ' + ${uri}">RDF Fiche</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" href="/css/rdf-style.css"/>

    <!-- Inline page CSS -->
    <style>
        /* Vlaanderen.be-like base */
        :root {
            --vl-blue: #0055cc;
            --vl-text: #1a1a1a;
            --vl-muted: #6f6f6f;
            --vl-border: #d8d8d8;
            --vl-bg: #ffffff;
            --vl-bg-light: #f4f4f4;
        }

        /* Page base */
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 16px;
            line-height: 1.75;
            color: var(--vl-text);
            background: var(--vl-bg);
        }

        /* Centered content column (CRUCIAL) */
        body > * {
            max-width: 760px;
            margin-left: auto;
            margin-right: auto;
            padding-left: 16px;
            padding-right: 16px;
        }

        /* Page title */
        .header {
            margin-top: 32px;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 2.6rem;
            line-height: 1.2;
            margin: 0 0 16px;
            font-weight: 700;
        }

        .header p {
            font-size: 0.95rem;
            color: var(--vl-muted);
        }

        .header a {
            color: var(--vl-blue);
            word-break: break-all;
        }

        /* Export links — simple text links */
        .export-options {
            margin-bottom: 48px;
            font-size: 0.95rem;
        }

        .export-options strong {
            display: block;
            margin-bottom: 8px;
        }

        .export-options a {
            margin-right: 16px;
            color: var(--vl-blue);
        }

        /* Section headings */
        h2 {
            font-size: 1.6rem;
            margin-top: 56px;
            margin-bottom: 16px;
        }

        /* Map */
        #map {
            height: 360px;
            margin-bottom: 32px;
            border: 1px solid var(--vl-border);
        }

        /* Details behave like content sections */
        details {
            margin-bottom: 48px;
            border-top: 1px solid var(--vl-border);
            padding-top: 24px;
        }

        summary {
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            list-style: none;
        }

        summary::-webkit-details-marker {
            display: none;
        }

        /* Section content */
        .rdf-section-content {
            margin-top: 24px;
        }

        /* Predicate rows */
        .predicate-object {
            margin-bottom: 24px;
        }

        .predicate-link {
            font-weight: 600;
            color: var(--vl-blue);
        }

        /* Objects */
        .object {
            margin-left: 24px;
            color: var(--vl-text);
        }

        /* Raw RDF */
        textarea {
            width: 100%;
            height: 320px;
            border: 1px solid var(--vl-border);
            padding: 12px;
            font-family: monospace;
            background: #fafafa;
        }

        /* Responsive */
        @media (max-width: 768px) {
            body > * {
                padding-left: 12px;
                padding-right: 12px;
            }

            .header h1 {
                font-size: 2rem;
            }
        }


    </style>
</head>

<body th:about="${uri}">
<div class="header">
    <h1 th:text="${title}">RDF Resource</h1>
    <p>
        <strong>URI:</strong>
        <a th:href="${uri}" th:text="${uri}">Resource URI</a>
    </p>
</div>

<div class="export-options">
    <strong>Export formats:</strong>
    <a th:href="${uri} + '?format=ttl'">Turtle</a>
    <a th:href="${uri} + '?format=jsonld'">JSON-LD</a>
    <a th:href="${uri} + '?format=rdf'">RDF/XML</a>
    <a th:href="${uri} + '?format=nt'">N-Triples</a>
</div>

<!-- Map -->
<div th:if="${hasGeoData}">
    <h2>Geografische Informatie</h2>
    <div id="map"></div>
</div>

<!-- RDF Sections -->
<div th:each="section : ${rdfSections}">
    <details open>
        <summary th:text="${section.title}"></summary>
        <div class="rdf-section-content">
            <div th:each="predicate : ${section.predicates}">
                <div class="predicate-object">
                    <a class="predicate-link"
                       th:href="${predicate.uri}"
                       th:text="${predicate.label}"></a>

                    <div class="object">
                        <span th:each="obj,stat : ${predicate.objects}">
                            <span th:if="${obj.isLiteral}"
                                  th:text="${obj.value}"></span>
                            <a th:if="${!obj.isLiteral}"
                               th:href="${obj.value}"
                               th:text="${obj.label}"></a>
                            <span th:if="${!stat.last}">, </span>
                        </span>
                    </div>
                </div>
            </div>
        </div>
    </details>
</div>

<!-- Raw RDF -->
<details>
    <summary>Ruwe RDF Data</summary>
    <div class="rdf-section-content">
        <textarea th:text="${rawRdfData}"></textarea>
    </div>
</details>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script th:if="${hasGeoData}" th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
        var map = L.map('map').setView([[${latitude}], [${longitude}]], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        L.marker([[${latitude}], [${longitude}]]).addTo(map);
    });
</script>

</body>
</html>
